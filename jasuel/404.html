<!DOCTYPE html>
<html lang="es-GT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Página no encontrada · JASUEL</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#071F43">
<!-- Rutas absolutas: esta página se muestra para cualquier ruta rota bajo /jasuel/ -->
<link rel="icon" href="/jasuel/assets/favicon.svg" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/jasuel/css/estilos.css?v=20261122m">
</head>
<body>

<header class="nav" data-fijo>
  <a class="nav-logo" href="/jasuel/" aria-label="Jasuel, volver al inicio">
    <span class="nav-logo-texto">JASUEL</span>
  </a>
</header>

<main class="error404">
  <svg class="marca-diamante" viewBox="0 0 24 20" aria-hidden="true">
    <path d="M6 1h12l5 6-11 12L1 7z" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/>
    <path d="M1 7h22M6 1l3 6 3-6M18 1l-3 6-3 0M9 7l3 12 3-12" fill="none" stroke="currentColor" stroke-width=".7" stroke-linejoin="round"/>
  </svg>
  <p class="error404-num" aria-hidden="true">404</p>
  <h1 class="error404-titulo">Esta pieza no está en la vitrina</h1>
  <p class="error404-texto">La página que buscas no existe o cambió de lugar. Nuestras joyas siguen en el catálogo.</p>
  <div class="error404-botones">
    <a class="boton boton-oro" href="/jasuel/#catalogo">Ver el catálogo</a>
    <a class="boton boton-linea" data-wa="Hola Jasuel, intenté abrir una página de su sitio y no funcionó.">Escríbenos por WhatsApp</a>
  </div>
  <p class="error404-ruta" id="ruta"></p>
</main>

<script src="/jasuel/js/datos.js?v=20261122m"></script>
<script>
  document.querySelectorAll("[data-wa]").forEach(function (el) {
    el.href = "https://wa.me/" + CONFIG.whatsapp + "?text=" + encodeURIComponent(el.dataset.wa);
    el.target = "_blank";
    el.rel = "noopener";
  });
  // La ruta llega en ?ruta= desde el 404 principal. Se muestra como texto,
  // nunca como HTML, para que un enlace malicioso no inyecte marcado.
  var ruta = new URLSearchParams(location.search).get("ruta");
  if (ruta) document.getElementById("ruta").textContent = "Intentaste abrir: " + ruta;
</script>
</body>
</html>
